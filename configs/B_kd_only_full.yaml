# Experiment B: KD-only on full GSM8K (λ_KD=1, λ_CE=0, T=2)
# Pure knowledge distillation — no hard-label CE.
# Loss = 1.0 * T² * KL(teacher || student) = 4.0 * KL
# Expected: smooth distributions, high entropy, lower maxprob, better calibration.
seed: 42
teacher_name: "Qwen/Qwen2.5-14B"
student_name: "Qwen/Qwen2.5-1.5B"
teacher_load_mode: "bf16"
student_dtype: "bf16"
max_length: 512
batch_size: 1
grad_accum_steps: 16
num_steps: 2000
lr: 5.0e-5
weight_decay: 0.0
max_grad_norm: 1.0
temperature: 2.0
lambda_kd: 1.0
lambda_ce: 0.0
log_every: 20
micro_overfit_n: null
save_every: 500
save_dir: "checkpoints/B_kd_only_full"
log_file: "logs/B_kd_only_full.jsonl"
run_sanity: false
