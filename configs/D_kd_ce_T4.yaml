# Experiment D: KD + CE with higher temperature (λ_KD=1, λ_CE=0.5, T=4)
# Tests the probabilistic hypothesis: T↑ → softer teacher → more smoothing.
# Loss = 1.0 * T² * KL + 0.5 * CE = 16.0 * KL + 0.5 * CE
# Expected: even higher entropy than C, maximum smoothing effect,
#           strongest calibration improvement.
seed: 42
teacher_name: "Qwen/Qwen2.5-14B"
student_name: "Qwen/Qwen2.5-1.5B"
teacher_load_mode: "bf16"
student_dtype: "bf16"
max_length: 512
batch_size: 4
grad_accum_steps: 4
num_steps: 2000
lr: 5.0e-5
weight_decay: 0.0
max_grad_norm: 1.0
temperature: 4.0
lambda_kd: 1.0
lambda_ce: 0.5
log_every: 20
micro_overfit_n: null
save_every: 500
save_dir: "checkpoints/D_kd_ce_T4"
log_file: "logs/D_kd_ce_T4.jsonl"
run_sanity: false
